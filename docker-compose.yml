services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "80"
    environment:
      CONTAINER_ROLE: web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  queue:
    build: .
    restart: unless-stopped
    env_file: .env
    command: php artisan queue:work --sleep=3 --tries=3
    environment:
      CONTAINER_ROLE: queue
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);'"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      web:
        condition: service_healthy

  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    command: php artisan schedule:work
    environment:
      CONTAINER_ROLE: scheduler
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);'"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      web:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis:/data

volumes:
  redis:
