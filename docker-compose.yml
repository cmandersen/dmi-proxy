services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "80"
    environment:
      CONTAINER_ROLE: web
    depends_on:
      - redis

  queue:
    build: .
    restart: unless-stopped
    env_file: .env
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      CONTAINER_ROLE: queue
    depends_on:
      web:
        condition: service_healthy

  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    command: php artisan schedule:work
    environment:
      CONTAINER_ROLE: scheduler
    depends_on:
      web:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis:/data

volumes:
  redis:
